[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoweaver"
version = "0.0.1-dev"
description = "Code context fabric for AI coding agents — deterministic call-graph indexing, hybrid retrieval, and single-tool MCP interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "fastmcp>=2.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fabric = "repoweaver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repoweaver"]
