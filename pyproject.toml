[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-context-fabric"
version = "0.5.1"
description = "Code context fabric for AI coding agents — deterministic call-graph indexing, hybrid retrieval, and single-tool MCP interface"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "fastmcp>=2.0",
    "typer>=0.16",
    "rich>=13",
    "pyyaml>=6",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ccf = "codecontextfabric.cli:main"
fabric = "codecontextfabric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codecontextfabric"]
