name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Test
        run: pytest tests/ -v

      - name: M1 acceptance gate
        run: fabric verify --level m1

      - name: Benchmark semantics gate
        run: fabric verify --level benchmark

      - name: M2 freshness and consistency gate
        run: fabric verify --level m2

      - name: Public-source leak scan
        run: python scripts/check_public.py
